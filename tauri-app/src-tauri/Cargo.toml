[package]
name = "space-astrophysics-desktop"
version = "0.1.0"
description = "Space and Astrophysics Desktop Application"
authors = ["Your Name"]
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.0", features = ["api-all", "custom-protocol"] }

[build-dependencies]
tauri-build = { version = "1.0", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
